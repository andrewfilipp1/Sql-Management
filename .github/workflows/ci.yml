name: CI

# Builds SQL Graphic Tool natively on Windows and macOS (the SQLite native module cannot be
# cross-compiled), runs a smoke test against the packaged app and keeps the installers.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      # Unsigned builds: do not look for signing certificates.
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install (also rebuilds better-sqlite3 for Electron)
        run: npm ci

      - name: Typecheck and build
        run: npm run build

      - name: Package (unpacked)
        run: npx electron-builder --dir --publish never

      # Integrated Windows authentication is tested against SQL Server LocalDB.
      - name: Start SQL Server LocalDB
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command sqllocaldb -ErrorAction SilentlyContinue)) {
            choco install sqllocaldb -y --no-progress
            $bin = Get-ChildItem 'C:\Program Files\Microsoft SQL Server\*\Tools\Binn\SqlLocalDB.exe' | Select-Object -First 1
            $env:PATH = "$($bin.DirectoryName);$env:PATH"
          }
          sqllocaldb create MSSQLLocalDB 2>$null
          sqllocaldb start MSSQLLocalDB
          sqllocaldb info MSSQLLocalDB
          Get-OdbcDriver -Platform 64-bit | Where-Object Name -like '*SQL Server*' | Select-Object -ExpandProperty Name
          "SMOKE_MSSQL_LOCALDB=1" >> $env:GITHUB_ENV

      - name: Smoke test the packaged app
        run: node scripts/smoke.mjs

      - name: Installers (NSIS on Windows, DMG/ZIP on macOS)
        run: npx electron-builder --publish never

      - name: Update feed config is packaged
        shell: bash
        run: |
          f=$(find release -path '*esources/app-update.yml' | head -1)
          test -n "$f" && grep -q 'provider: github' "$f" && echo "found $f"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SQL-Graphic-Tool-${{ runner.os }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
          if-no-files-found: error
          retention-days: 14
