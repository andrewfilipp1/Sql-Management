name: CI

# Builds SchemaScope natively on Windows and macOS (the SQLite native module cannot be
# cross-compiled), runs a smoke test against the packaged app and keeps the installers.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      # Unsigned builds: do not look for signing certificates.
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install (also rebuilds better-sqlite3 for Electron)
        run: npm ci

      - name: Typecheck and build
        run: npm run build

      - name: Package (unpacked)
        run: npx electron-builder --dir --publish never

      - name: Smoke test the packaged app
        run: node scripts/smoke.mjs

      - name: Installers (NSIS on Windows, DMG/ZIP on macOS)
        run: npx electron-builder --publish never

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SchemaScope-${{ runner.os }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
          if-no-files-found: error
          retention-days: 14
