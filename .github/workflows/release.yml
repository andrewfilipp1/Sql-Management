name: Release

# Push a tag like v0.2.0 (matching "version" in package.json) to build the installers on
# Windows and macOS and publish them to GitHub Releases. Installed apps check that feed
# for updates (electron-updater reads latest.yml / latest-mac.yml from the release).
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  publish:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      # Needed to create the release and upload the installers.
      contents: write
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Tag must match package.json version
        shell: bash
        run: |
          v=$(node -p "require('./package.json').version")
          if [ "v$v" != "$GITHUB_REF_NAME" ]; then echo "Tag $GITHUB_REF_NAME does not match package.json version $v"; exit 1; fi

      - name: Install
        run: npm ci

      - name: Typecheck and build
        run: npm run build

      - name: Package (unpacked) and smoke test
        run: |
          npx electron-builder --dir --publish never
          node scripts/smoke.mjs

      - name: Build installers and publish to GitHub Releases
        run: npx electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
