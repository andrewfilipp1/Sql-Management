name: Release

# `npm run release` bumps the version and pushes a tag like v0.2.0. This builds the installers on
# Windows and macOS, uploads them to a draft GitHub Release, and publishes it once both are there.
# Installed apps check that feed for updates (latest.yml / latest-mac.yml in the release).
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  draft:
    name: Create draft release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Create the draft (the build jobs upload into it)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft --title "SQL Graphic Tool ${GITHUB_REF_NAME#v}" --generate-notes

  build:
    name: ${{ matrix.os }}
    needs: draft
    strategy:
      fail-fast: true
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      # Needed to upload the installers to the draft release.
      contents: write
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Tag must match package.json version
        shell: bash
        run: |
          v=$(node -p "require('./package.json').version")
          if [ "v$v" != "$GITHUB_REF_NAME" ]; then echo "Tag $GITHUB_REF_NAME does not match package.json version $v"; exit 1; fi

      - name: Install
        run: npm ci

      - name: Typecheck and build
        run: npm run build

      - name: Package (unpacked) and smoke test
        run: |
          npx electron-builder --dir --publish never
          node scripts/smoke.mjs

      - name: Build installers and upload to the draft release
        run: npx electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Check both update feeds are attached, then publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          assets=$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
          echo "$assets"
          for f in latest.yml latest-mac.yml; do echo "$assets" | grep -qx "$f" || { echo "Missing $f"; exit 1; }; done
          echo "$assets" | grep -q -- '-arm64\.zip$' || { echo "Missing the macOS zip"; exit 1; }
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --latest
